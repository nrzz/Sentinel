{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sentinel.fullname" . }}-api
  namespace: {{ .Values.namespaces.platform }}
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sentinel.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "sentinel.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "sentinel.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "sentinel.image" (dict "repository" .Values.api.image.repository "tag" .Values.image.tag "Values" .Values "Chart" .Chart) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "sentinel.fullname" . }}-config
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: PostgreSQL__ConnectionString
              value: {{ include "sentinel.postgresql.connectionString" . | quote }}
            - name: ClickHouse__ConnectionString
              value: {{ include "sentinel.clickhouse.connectionString" . | quote }}
            - name: Redis__ConnectionString
              value: {{ include "sentinel.redis.connectionString" . | quote }}
            - name: RabbitMQ__ConnectionString
              value: {{ include "sentinel.rabbitmq.connectionString" . | quote }}
            - name: Jwt__SecretKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "sentinel.fullname" . }}-secrets
                  key: jwt-secret-key
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.externalDatabase.postgresql.existingSecret }}{{ .Values.externalDatabase.postgresql.existingSecret }}{{ else }}{{ include "sentinel.fullname" . }}-secrets{{ end }}
                  key: {{ if .Values.externalDatabase.postgresql.existingSecret }}{{ .Values.externalDatabase.postgresql.existingSecretPasswordKey }}{{ else }}postgres-password{{ end }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.externalDatabase.clickhouse.existingSecret }}{{ .Values.externalDatabase.clickhouse.existingSecret }}{{ else }}{{ include "sentinel.fullname" . }}-secrets{{ end }}
                  key: {{ if .Values.externalDatabase.clickhouse.existingSecret }}{{ .Values.externalDatabase.clickhouse.existingSecretPasswordKey }}{{ else }}clickhouse-password{{ end }}
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.externalDatabase.rabbitmq.existingSecret }}{{ .Values.externalDatabase.rabbitmq.existingSecret }}{{ else }}{{ include "sentinel.fullname" . }}-secrets{{ end }}
                  key: {{ if .Values.externalDatabase.rabbitmq.existingSecret }}{{ .Values.externalDatabase.rabbitmq.existingSecretPasswordKey }}{{ else }}rabbitmq-password{{ end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
