{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sentinel.fullname" . }}-secrets
  namespace: {{ .Values.namespaces.platform }}
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret-key: {{ required "secrets.jwtSecretKey is required (min 32 characters)" .Values.secrets.jwtSecretKey | quote }}
  {{- if not .Values.externalDatabase.postgresql.enabled }}
  postgres-password: {{ .Values.postgresql.auth.password | default (randAlphaNum 32) | quote }}
  {{- end }}
  {{- if not .Values.externalDatabase.clickhouse.enabled }}
  clickhouse-password: {{ .Values.clickhouse.auth.password | default (randAlphaNum 32) | quote }}
  {{- end }}
  {{- if not .Values.externalDatabase.rabbitmq.enabled }}
  rabbitmq-password: {{ .Values.rabbitmq.auth.password | default (randAlphaNum 32) | quote }}
  rabbitmq-erlang-cookie: {{ .Values.rabbitmq.auth.erlangCookie | default (randAlphaNum 32) | quote }}
  {{- end }}
  {{- if and .Values.redis.enabled .Values.redis.auth.enabled (not .Values.externalDatabase.redis.enabled) }}
  redis-password: {{ .Values.redis.auth.password | default (randAlphaNum 32) | quote }}
  {{- end }}
{{- end }}
