name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22'

jobs:
  dotnet-build:
    name: .NET Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore Sentinel.slnx

      - name: Build
        run: dotnet build Sentinel.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/Sentinel.UnitTests/Sentinel.UnitTests.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

      - name: Check formatting
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- '*.cs' | tr '\n' ' ')
          if [ -z "$(echo "$CHANGED" | tr -d ' ')" ]; then
            echo "No C# files changed; skipping format check."
            exit 0
          fi
          dotnet format Sentinel.slnx --verify-no-changes --include $CHANGED --verbosity diagnostic

      - name: Check for vulnerable NuGet packages
        run: |
          dotnet list Sentinel.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable-packages.txt
          if grep -q "has the following vulnerable packages" vulnerable-packages.txt; then
            echo "::error::Vulnerable NuGet packages detected"
            cat vulnerable-packages.txt
            exit 1
          fi
          echo "No vulnerable NuGet packages found"

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/sentinel-web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/sentinel-web/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Type check and build
        run: npm run build

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [dotnet-build]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sentinel_test
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore and build
        run: |
          dotnet restore Sentinel.slnx
          dotnet build Sentinel.slnx --configuration Release --no-restore

      - name: Run integration tests
        env:
          PostgreSQL__ConnectionString: "Host=localhost;Port=5432;Database=sentinel_test;Username=sentinel;Password=sentinel_test_password"
          Redis__ConnectionString: "localhost:6379"
        run: dotnet test tests/Sentinel.IntegrationTests/Sentinel.IntegrationTests.csproj --configuration Release --no-build --verbosity normal

  docker-build:
    name: Docker Build (smoke)
    runs-on: ubuntu-latest
    needs: [dotnet-build, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t sentinel-api:ci .

      - name: Build Worker image
        run: docker build -f docker/Dockerfile.worker -t sentinel-worker:ci .

      - name: Build Web image
        run: docker build -f docker/Dockerfile.web -t sentinel-web:ci .
