[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-sdk"
version = "1.0.0"
description = "Official Python client SDK for the Sentinel observability platform."
requires-python = ">=3.10"
authors = [{ name = "Sentinel" }]
dependencies = [
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["sentinel_sdk"]
